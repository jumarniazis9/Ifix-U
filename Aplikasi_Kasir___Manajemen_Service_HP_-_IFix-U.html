    // =========================================================================
    // EKSPOR & IMPOR EXCEL (.XLSX / .CSV) DAN BACKUP / RESTORE JSON
    // =========================================================================
    function exportAllExcelXLSX() {
      try {
        if (typeof XLSX === 'undefined') {
          exportFinanceCSV();
          return;
        }
        const wb = XLSX.utils.book_new();

        const serviceRows = services.map(s => {
          const total = Number(s.cost) || 0;
          const dp = Number(s.dp) || 0;
          const settlement = Number(s.settlement) || 0;
          const sisa = Math.max(0, total - dp - settlement);
          return {
            'No Tiket': s.ticket,
            'Tanggal Masuk': s.date,
            'Nama Pelanggan': s.customer,
            'No HP/WA': s.phone,
            'Email': s.email || '',
            'Type HP': s.device,
            'Teknisi': s.technician,
            'IMEI/SN': s.imei || '',
            'Status Service': s.status,
            'Keluhan': s.complaint,
            'Kondisi Fisik': s.physical || '',
            'Biaya Service': total,
            'DP Awal': dp,
            'Pelunasan': settlement,
            'Sisa Bayar': sisa,
            'Tanggal Selesai/Lunas': s.completedDate || s.settlementDate || ''
          };
        });

        const spInRows = sparepartsIn.map(sp => {
          const terpakai = getUsedQtyForSparepart(sp.id);
          return {
            'Tanggal Masuk': sp.date,
            'Kode Sparepart': sp.code,
            'Nama Sparepart': sp.name,
            'Kompatibel HP': sp.deviceCompat || '',
            'Kategori': sp.category || '',
            'Qty Masuk': Number(sp.qty) || 0,
            'Qty Terpakai': terpakai,
            'Sisa Stok': Math.max(0, (Number(sp.qty) || 0) - terpakai),
            'Harga Beli': Number(sp.buyPrice) || 0,
            'Harga Jual': Number(sp.sellPrice) || 0,
            'Supplier': sp.supplier || ''
          };
        });

        const spUsedRows = sparepartsUsed.map(u => {
          const qty = Number(u.qty) || 0;
          const buy = Number(u.buyPrice) || 0;
          const sell = Number(u.sellPrice) || 0;
          return {
            'Tanggal Pakai': u.date,
            'No Tiket': u.ticket,
            'Type HP': u.device || '',
            'Teknisi': u.technician,
            'Kode Sparepart': u.sparepartCode,
            'Nama Sparepart': u.sparepartName,
            'Qty': qty,
            'Total Modal': qty * buy,
            'Total Jual': qty * sell,
            'Keterangan': u.note || ''
          };
        });

        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(serviceRows.length ? serviceRows : [{}]), 'Service Masuk');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(spInRows.length ? spInRows : [{}]), 'Sparepart Masuk');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(spUsedRows.length ? spUsedRows : [{}]), 'Sparepart Terpakai');

        XLSX.writeFile(wb, `IFix-U_Data_Lengkap_${getTodayISO()}.xlsx`);
        showToast('Berhasil mengekspor data ke file Excel (.xlsx)!');
      } catch (err) {
        showToast('Gagal mengekspor Excel, mencoba ekspor CSV...', 'warning');
        exportFinanceCSV();
      }
    }

    function handleImportExcelFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          if (typeof XLSX === 'undefined') {
            showToast('Library Excel belum siap dimuat.', 'error');
            return;
          }
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          let importedServiceCount = 0;
          let importedSpInCount = 0;
          let importedSpUsedCount = 0;

          workbook.SheetNames.forEach(sheetName => {
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });
            if (!rows.length) return;

            const normalizedName = sheetName.toLowerCase();
            const firstRow = rows[0];

            if (normalizedName.includes('service') || ('No Tiket' in firstRow && 'Nama Pelanggan' in firstRow)) {
              rows.forEach((r, idx) => {
                const ticket = String(r['No Tiket'] || r['ticket'] || '').trim();
                const customer = String(r['Nama Pelanggan'] || r['customer'] || '').trim();
                if (!ticket && !customer) return;

                const statusVal = String(r['Status Service'] || r['status'] || 'Proses').trim() || 'Proses';
                const costVal = parseRupiah(r['Biaya Service'] ?? r['cost'] ?? 0);
                const dpVal = parseRupiah(r['DP Awal'] ?? r['dp'] ?? 0);
                const settleVal = parseRupiah(r['Pelunasan'] ?? r['settlement'] ?? 0);
                const dateVal = String(r['Tanggal Masuk'] || r['date'] || getTodayISO()).slice(0, 10);

                const baseSrv = {
                  id: 'SRV-IMP-' + Date.now() + '-' + idx,
                  ticket: ticket || generateTicketNumber(),
                  date: dateVal,
                  customer: customer || 'Pelanggan',
                  phone: String(r['No HP/WA'] || r['phone'] || '-').trim(),
                  email: String(r['Email'] || r['email'] || '').trim(),
                  device: String(r['Type HP'] || r['device'] || '-').trim(),
                  technician: String(r['Teknisi'] || r['technician'] || 'Admin').trim(),
                  imei: String(r['IMEI/SN'] || r['imei'] || '').trim(),
                  status: statusVal,
                  cost: costVal,
                  dp: dpVal,
                  dpDate: dpVal > 0 ? dateVal : '',
                  settlement: settleVal,
                  settlementDate: settleVal > 0 ? (String(r['Tanggal Selesai/Lunas'] || dateVal).slice(0, 10)) : '',
                  settlementMethod: 'Tunai',
                  autoSettledFromComplete: false,
                  completedDate: isCompletedStatus(statusVal) ? (String(r['Tanggal Selesai/Lunas'] || dateVal).slice(0, 10)) : '',
                  complaint: String(r['Keluhan'] || r['complaint'] || '-').trim(),
                  physical: String(r['Kondisi Fisik'] || r['physical'] || '').trim(),
                  iqc: {},
                  oqc: {}
                };

                const { updatedService } = applyAutoSettlementOnComplete(baseSrv, dateVal);
                const existingIdx = services.findIndex(item => item.ticket === updatedService.ticket);
                if (existingIdx !== -1) {
                  services[existingIdx] = { ...services[existingIdx], ...updatedService, id: services[existingIdx].id };
                } else {
                  services.unshift(updatedService);
                }
                importedServiceCount++;
              });
            } else if (normalizedName.includes('masuk') || ('Kode Sparepart' in firstRow && 'Qty Masuk' in firstRow)) {
              rows.forEach((r, idx) => {
                const code = String(r['Kode Sparepart'] || r['code'] || '').trim().toUpperCase();
                const name = String(r['Nama Sparepart'] || r['name'] || '').trim();
                if (!code && !name) return;

                const spObj = {
                  id: 'SP-IMP-' + Date.now() + '-' + idx,
                  date: String(r['Tanggal Masuk'] || r['date'] || getTodayISO()).slice(0, 10),
                  code: code || `SP-${idx + 1}`,
                  name: name || 'Sparepart',
                  deviceCompat: String(r['Kompatibel HP'] || r['deviceCompat'] || '').trim(),
                  category: String(r['Kategori'] || r['category'] || 'Lainnya').trim(),
                  qty: parseInt(r['Qty Masuk'] ?? r['qty'] ?? 1, 10) || 1,
                  buyPrice: parseRupiah(r['Harga Beli'] ?? r['buyPrice'] ?? 0),
                  sellPrice: parseRupiah(r['Harga Jual'] ?? r['sellPrice'] ?? 0),
                  supplier: String(r['Supplier'] || r['supplier'] || '').trim()
                };

                const existingIdx = sparepartsIn.findIndex(item => item.code === spObj.code && item.name === spObj.name);
                if (existingIdx !== -1) {
                  sparepartsIn[existingIdx] = { ...sparepartsIn[existingIdx], ...spObj, id: sparepartsIn[existingIdx].id };
                } else {
                  sparepartsIn.unshift(spObj);
                }
                importedSpInCount++;
              });
            } else if (normalizedName.includes('terpakai') || ('Nama Sparepart' in firstRow && 'Qty' in firstRow)) {
              rows.forEach((r, idx) => {
                const spName = String(r['Nama Sparepart'] || r['sparepartName'] || '').trim();
                const ticket = String(r['No Tiket'] || r['ticket'] || '').trim();
                if (!spName && !ticket) return;

                const qty = parseInt(r['Qty'] ?? r['qty'] ?? 1, 10) || 1;
                const totalModal = parseRupiah(r['Total Modal'] ?? 0);
                const buyPrice = r['Harga Beli'] !== undefined ? parseRupiah(r['Harga Beli']) : (qty > 0 ? Math.round(totalModal / qty) : 0);

                sparepartsUsed.unshift({
                  id: 'SPU-IMP-' + Date.now() + '-' + idx,
                  date: String(r['Tanggal Pakai'] || r['date'] || getTodayISO()).slice(0, 10),
                  serviceId: '',
                  ticket: ticket || '-',
                  device: String(r['Type HP'] || r['device'] || '').trim(),
                  technician: String(r['Teknisi'] || r['technician'] || 'Admin').trim(),
                  sparepartId: '',
                  sparepartCode: String(r['Kode Sparepart'] || r['sparepartCode'] || 'SP').trim().toUpperCase(),
                  sparepartName: spName || 'Sparepart',
                  qty,
                  buyPrice,
                  sellPrice: parseRupiah(r['Harga Jual'] ?? r['sellPrice'] ?? 0),
                  note: String(r['Keterangan'] || r['note'] || '').trim()
                });
                importedSpUsedCount++;
              });
            }
          });

          saveToStorage();
          renderServiceTable();
          renderNotaTable();
          renderSparepartInTable();
          populateSparepartUsedDropdowns();
          renderSparepartUsedTable();
          renderFinanceReport();

          showToast(`Impor selesai: ${importedServiceCount} service, ${importedSpInCount} stok masuk, ${importedSpUsedCount} sparepart terpakai.`);
        } catch (err) {
          showToast('Format file Excel/CSV tidak dapat dibaca.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportBackupJSON() {
      const payload = {
        app: 'IFix-U',
        version: '3.0',
        exportedAt: new Date().toISOString(),
        services,
        sparepartsIn,
        sparepartsUsed
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `IFix-U_Backup_${getTodayISO()}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('Backup JSON berhasil diunduh!');
    }

    function handleRestoreJSONFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed.services) || !Array.isArray(parsed.sparepartsIn) || !Array.isArray(parsed.sparepartsUsed)) {
            showToast('Struktur file backup JSON tidak sesuai.', 'error');
            return;
          }
          services = parsed.services;
          sparepartsIn = parsed.sparepartsIn;
          sparepartsUsed = parsed.sparepartsUsed;
          saveToStorage();
          renderServiceTable();
          renderNotaTable();
          renderSparepartInTable();
          populateSparepartUsedDropdowns();
          renderSparepartUsedTable();
          renderFinanceReport();
          showToast('Data backup JSON berhasil dipulihkan!');
        } catch (err) {
          showToast('File JSON rusak atau tidak valid.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }
